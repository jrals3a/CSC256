# Verified: <today's date, e.g. 2026-08-29>


[project]
name = "task-tracker"
version = "1.0.0"
description = "Task Tracker - CSC 256 Software Quality Assurance Course Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.32.0",       # TimeService external API calls (Sprint 5+)
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.14.1",
    "mypy>=2.1.0",
    "playwright>=1.60.0",                  # Playwright Python bindings (Sprint 4+)
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-flask>=1.3.0",                 # Flask test client helpers (Sprint 3+)
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.7.0",            # pytest-playwright fixtures and CLI options (Sprint 4+)
    "pytest-xdist>=3.8.0",
    "requests-mock>=1.12.1",               # HTTP-level mocking for TimeService tests (Sprint 5+)
    "robotframework>=7.4.2",              # Robot Framework core (Sprint 5+)
    "robotframework-browser>=18.0.0",     # Browser Library — installed but not actively used in this course
                                           # For Java/non-Python projects: language-agnostic UI acceptance testing
                                           # Requires one-time init: uv run rfbrowser init --skip-browsers
    "robotframework-requests>=0.9.0",     # RequestsLibrary — PRIMARY Robot Framework library (Sprint 5+)
    "ruff>=0.15.15",
    "types-requests>=2.32.0",             # mypy type stubs for requests library (Sprint 3+)
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = ["tests/", "setup_browsers.py"]


# ---------------------------------------------------------------------------
# One-time browser setup required after first `uv sync` on a new machine.
# Run this ONCE (not on every sync):
#
#   uv run python setup_browsers.py
#
# This installs Playwright's Chromium browser binaries (for pytest-playwright)
# and initializes the Robot Framework Browser library to reuse them.
# Required for: pytest-playwright (S4_3+) and Playwright UI tests.
# Robot Framework tests use RequestsLibrary — no browser setup needed for RF.
# ---------------------------------------------------------------------------
